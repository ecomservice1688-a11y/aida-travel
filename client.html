<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réserver · Aida Travel</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

<header class="pbar">
  <div class="pbar-in">
    <a href="/index.html" class="brand"><img src="logo.svg" alt="Aida Travel"><b>AIDA TRAVEL</b></a>
    <div class="actions" id="barRight">
      <a class="btn ghost small" href="/index.html">← Retour au site</a>
    </div>
  </div>
</header>

<div class="wrap">

  <div id="authView">
    <div class="card auth-card">
      <p class="eyebrow center">Aida Travel</p>
      <h1 class="h2 center">Bienvenue 👋</h1>
      <p class="muted center" style="margin-bottom:20px">Aucun compte nécessaire : remplissez le formulaire, nous vous répondons sous 24 h.</p>

      <form id="bookForm">
        <div class="field"><label>Votre nom complet *</label><input type="text" id="bkName" required></div>
        <div class="field"><label>Votre email *</label><input type="email" id="bkEmail" required></div>
        <div class="field"><label>Téléphone / WhatsApp</label><input type="tel" id="bkPhone"></div>
        <div class="field"><label>Circuit *</label><select id="bkTour" required></select></div>
        <div class="row2">
          <div class="field"><label>Circuits / départs</label><select id="bkDate"><option value="">Toutes les dates</option></select></div>
          <div class="field"><label>Nombre de voyageurs *</label><select id="bkTravellers"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8+</option></select></div>
        </div>
        <div class="field"><label>Message / questions</label><textarea id="bkMsg" rows="3" placeholder="Vol, préférences, demande particulière..."></textarea></div>
        <button type="submit" class="btn block">Envoyer ma demande</button>
        <p class="booking-note" id="bkNote"></p>
        <p class="msg err hidden" id="bkMsgErr"></p>
      </form>
    </div>
  </div>

</div>

<script src="js/client.js"></script>
</body>
</html>
