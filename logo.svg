<svg width="360" height="140" viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C478"/>
      <stop offset="1" stop-color="#E89B52"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A41"/>
      <stop offset="1" stop-color="#3A2E5C"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#FFD98E"/>
      <stop offset="1" stop-color="#E8703B"/>
    </radialGradient>
  </defs>

  <!-- Background badge / sun -->
  <circle cx="52" cy="52" r="48" fill="url(#sky)"/>
  <circle cx="52" cy="52" r="40" fill="url(#sun)" opacity="0.95"/>

  <!-- Stars -->
  <circle cx="30" cy="30" r="1.6" fill="#FFE9C2"/>
  <circle cx="46" cy="24" r="1.4" fill="#FFE9C2"/>
  <circle cx="66" cy="28" r="1.6" fill="#FFE9C2"/>
  <circle cx="34" cy="68" r="1.3" fill="#FFE9C2"/>
  <circle cx="72" cy="70" r="1.4" fill="#FFE9C2"/>

  <!-- Dune silhouettes -->
  <path d="M10 52 Q34 30 52 48 T92 50 V92 H10 Z" fill="#1B2A41" opacity="0.9"/>
  <path d="M24 78 Q44 58 60 74 T92 76 V92 H24 Z" fill="#101A2A" opacity="0.95"/>

  <!-- Tassili rock arch -->
  <circle cx="52" cy="55" r="17" fill="none" stroke="#F5C478" stroke-width="5"/>
  <path d="M35 72 V72 Q35 58 52 58 Q69 58 69 72 Z" fill="#F5C478"/>

  <!-- Campfire -->
  <path d="M49 84 l3 -6 l3 6 z" fill="#E8703B"/>
  <path d="M51 89 l1.5 -3 l1.5 3 z" fill="#F2A65A"/>

  <!-- Text -->
  <text x="122" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#E89B52" letter-spacing="4">AIDA</text>
  <text x="124" y="90" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1B2A41" letter-spacing="9">TRAVEL</text>

  <!-- Tagline -->
  <text x="124" y="112" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A6D4B" letter-spacing="2.5">DJANET &amp; TAMANRASSET · SAHARA</text>

  <!-- Divider line -->
  <line x1="122" y1="100" x2="346" y2="100" stroke="#E89B52" stroke-width="1" opacity="0.6"/>
</svg>