services:
  - type: web
    name: aida-travel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_USER
        value: aida
        sync: false
      - key: ADMIN_PASS
        value: aida
        sync: false
      - key: MONGODB_URI
        sync: false