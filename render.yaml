services:
  - type: web
    name: aida-travel
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: admin123