name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Aida Travel pour garder l'instance eveillee
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://aida-travel.onrender.com/robots.txt || true)
          echo "code HTTP: $code"
          if [ "$code" != "200" ]; then exit 1; fi